[pytest]
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %H:%M:%S

testpaths = testcases
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -s
    -v
    --strict-markers
    --tb=short
    -p no:cacheprovider

markers =
    smoke: smoke test (basic sanity checks)
    regression: regression test
    negative: negative/error handling test
    positive: positive/happy path test
    full_flow: full end-to-end business flow
