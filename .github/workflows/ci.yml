name: Petstore API Test CI

# ──────────────────────── 触发条件 ────────────────────────
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:  # 允许手动触发

# ──────────────────────── 全局配置 ────────────────────────
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true  # 同一分支的旧 job 自动取消

# ──────────────────────── Job 定义 ────────────────────────
jobs:

  # -------------------------------------------------------
  # Job 1: Lint — 代码静态检查（快速前置门控）
  # -------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install ruff
        run: pip install ruff==0.3.7

      - name: Run ruff check
        run: ruff check . --ignore E501,W503  # 忽略行长度（和你当前代码风格一致）
        continue-on-error: false

  # -------------------------------------------------------
  # Job 2: Test — 多 Python 版本矩阵测试 + Allure 结果
  # -------------------------------------------------------
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint  # 必须 lint 通过才跑测试

    strategy:
      fail-fast: false  # 所有版本都跑完，不因一个失败就取消
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with Allure + xdist
        run: |
          pytest \
            --alluredir=./allure-results \
            -n auto \
            -p no:cacheprovider

      - name: Upload Allure results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-py${{ matrix.python-version }}
          path: ./allure-results
          if-no-files-found: warn
          retention-days: 7

  # -------------------------------------------------------
  # Job 3: Publish — 生成 Allure HTML 报告并发布到 GitHub Pages
  # （只在 Python 3.12 + main/master 分支上执行一次）
  # -------------------------------------------------------
  publish:
    name: Publish Allure Report
    runs-on: ubuntu-latest
    needs: test
    if: |
      matrix.python-version == '3.12' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Allure results (Python 3.12)
        uses: actions/download-artifact@v4
        with:
          name: allure-results-py3.12
          path: ./allure-results

      - name: Set up Java 17 (Allure CLI 依赖)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Allure Commandline
        run: |
          curl -sL https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.tgz -o /tmp/allure.tgz
          tar -xzf /tmp/allure.tgz -C /tmp/
          echo "/tmp/allure-2.27.0/bin" >> $GITHUB_PATH
          allure --version

      - name: Generate Allure HTML report
        run: |
          allure generate ./allure-results -o ./allure-report --clean

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Allure report to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./allure-report

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
