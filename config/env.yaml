# ============================================================
# Petstore API 环境配置
# ============================================================
# api_key: Swagger 官方 Demo Key，可通过环境变量 PETSTORE_API_KEY 覆盖
# ============================================================

base:
  env: test
  base_url: "https://petstore.swagger.io/v2"
  api_key: "special-key"                  # 默认 API Key
  timeout: 10                             # 请求超时（秒）
  log_level: "DEBUG"                      # DEBUG / INFO / WARNING / ERROR
  log_retention: "7 days"                 # 日志保留天数
  allure_report_dir: "./allure-results"

  # API 版本信息
  api_version: "2.0"
  content_type: "application/json"

  # 公共 Header
  default_headers:
    Content-Type: "application/json"
    Accept: "application/json"
